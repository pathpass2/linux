name: Build master-rk3588-evb4-lpddr4-v10.img

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ARCH: arm64
  src_path: /home/runner/work/linux/linux
  modules_path: /home/runner/work/linux/linux/modules/lib/modules

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_tag }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Fix Script Permissions
        run: |
          find . -type f -name "*.sh" -exec chmod +x {} \;
          find . -type f -name "mkimg" -exec chmod +x {} \;
          find . -type f -name "resource_tool" -exec chmod +x {} \;
          find . -type f -name "mkbootimg" -exec chmod +x {} \;
          chmod +x ./scripts/*

      - name: Install Latest LZ4
        run: |
          LZ4_LATEST=$(curl -s https://api.github.com/repos/lz4/lz4/releases/latest | grep 'tarball_url' | cut -d\" -f4)
          wget $LZ4_LATEST -O lz4-latest.tar.gz
          tar -xzf lz4-latest.tar.gz
          cd lz4-lz4-*
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          lz4 --version

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            device-tree-compiler \
            u-boot-tools \
            libssl-dev \
            bc \
            flex \
            bison \
            libncurses-dev \
            initramfs-tools \
            busybox-static
          sudo -E apt-get -y install $(curl -fsSL https://tinyurl.com/ubuntu2204-build-armbian)

      - name: Setup ARM Toolchain
        run: |
          wget https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar xf arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu/bin" >> $GITHUB_PATH

      - name: Get Kernel Version
        run: |
          echo "kernel_main_version=$(make kernelversion)" >> $GITHUB_ENV
          echo "release_tag=rk3588-evb4-v$(make kernelversion)" >> $GITHUB_ENV

      - name: Set armbian_path
        run: |
          echo "armbian_path=${{ env.src_path }}/armbian_boot" >> $GITHUB_ENV
          echo "dtb_path=${{ env.src_path }}/dtbs" >> $GITHUB_ENV
          echo "armbian_file_path=${{ env.src_path }}/armbian_boot_files" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          mkdir -p ${{ env.armbian_path }}/
          mkdir -p ${{ env.armbian_file_path }}
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- rk3588_defconfig
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- dtbs
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- rk3588-evb4-lpddr4-v10.img -j$(nproc)
          make ARCH=$ARCH CROSS_COMPILE=aarch64-none-linux-gnu- modules_install INSTALL_MOD_PATH=${{ env.src_path }}/modules
          echo "${{ env.kernel_main_version }}"
          echo "查看编译好的boot.img"
          ls -lh boot.img
          echo "重命名boot.img为rk3588-evb4-lpddr4-v10-${{ env.kernel_main_version }}.img"
          mv boot.img rk3588-evb4-lpddr4-v10-boot-${{ env.kernel_main_version }}.img
          ls -lh rk3588-evb4-lpddr4-v10-boot-${{ env.kernel_main_version }}.img
          echo "当前所在编译路径：$(pwd)"
          
          # 修改软链接 - 删除build和source，只保留build指向正确路径
          cd ${{ env.modules_path }}
          echo "进入modules路径：${{ env.modules_path }}"
          cd ${{ env.kernel_main_version }}
          echo "修复软链接..."
          rm -f build source
          ln -sf /usr/src/linux-headers-${{ env.kernel_main_version }} build
          echo "软链接修复完成："
          ls -lh build
          cd ..
          
          echo "查看modules"
          ls
          echo "${{ env.kernel_main_version }}"
          echo "查看模块详情"
          ls -lh ${{ env.kernel_main_version }}
          echo "打包modules"
          tar -zcf ${{ env.kernel_main_version }}-modules.tar.gz ${{ env.kernel_main_version }}
          echo "查看打包的modules.tar.gz"
          ls -lh

      - name: tar ap6275p_wifi_firmware
        run: |
          cd ${{ env.src_path }}/tspi_wifi_firmware
          tar -zcf ap6275p_wifi_firmware.tar.gz *

      - name: Build Kernel-headers
        run: |
          mkdir ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}
          cp -a Module.symvers ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/
          cp -a Makefile ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/
          cp -a scripts ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/
          mkdir -p ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/arch/arm64
          cp -a arch/arm64/include ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/arch/arm64/include
          cp -a arch/arm64/kvm ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/arch/arm64/kvm
          cp -a arch/arm64/Makefile ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/arch/arm64/Makefile
          cp -a include ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/
          cp -a .config ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/
          cd ${{ env.src_path }}
          tar -zcf ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}.tar.gz linux-headers-${{ env.kernel_main_version }}
          echo "当前所在路径：$(pwd)"
          echo "查看打包的linux-headers-${{ env.kernel_main_version }}.tar.gz"
          ls -lh ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}.tar.gz

      - name: Compression_boot_files
        run: |
          mkdir ${{ env.src_path }}/boot_files
          cd ${{ env.src_path }}/boot_files
          mv ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}.tar.gz .
          mv ${{ env.modules_path }}/${{ env.kernel_main_version }}-modules.tar.gz .
          mv ${{ env.src_path }}/rk3588-evb4-lpddr4-v10-boot-${{ env.kernel_main_version }}.img .
          cp -a ${{ env.src_path }}/tspi_wifi_firmware/ap6275p_wifi_firmware.tar.gz .
          tar -zcvf rk3588-evb4-lpddr4-v10-${{ env.kernel_main_version }}.tar.gz *
          ls

      - name: create armbian_modules
        run: |
          cd ${{ env.modules_path }}
          # 打包前修改软链接 - 删除source
          cd ${{ env.kernel_main_version }}
          echo "修复armbian_modules软链接..."
          rm -f build source
          ln -sf /usr/src/linux-headers-${{ env.kernel_main_version }} build
          echo "软链接修复完成："
          ls -lh build
          cd ..
          tar -zcf modules-${{ env.kernel_main_version }}.tar.gz ${{ env.kernel_main_version }}
          mv modules-${{ env.kernel_main_version }}.tar.gz ${{ env.armbian_path }}/

      - name: create armbian_headers
        run: |
          cd ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }}/
          tar -zcf ${{ env.armbian_path }}/headers-${{ env.kernel_main_version }}.tar.gz .

      - name: edit armbian_dtb
        run: |
          mkdir -p ${{ env.dtb_path }}/dtb/rockchip
          echo "查看未修改前的dtb"
          ls -lh ${{ env.src_path }}/arch/arm64/boot/dts/rockchip/rk3588-evb4-lpddr4-v10.dtb
          echo "复制dtb到armbian_boot路径"
          cp -a ${{ env.src_path }}/arch/arm64/boot/dts/rockchip/*.dtb ${{ env.dtb_path }}/dtb/rockchip
          cd ${{ env.dtb_path }}/dtb/rockchip
          echo "反编译"
          dtc -I dtb -O dts rk3588-evb4-lpddr4-v10.dtb -o file.dts
          echo "删除未修改的dtb"
          rm -rf rk3588-evb4-lpddr4-v10.dtb
          echo "修改dts"
          sed -i '/mmcblk0p3/d' file.dts
          echo "重新编译dtb"
          dtc -I dts -O dtb file.dts -o rk3588-evb4-lpddr4-v10.dtb
          echo "删除未修改的dts"
          rm -rf file.dts
          echo "打包dtb"
          tar -zcf dtb-rockchip-${{ env.kernel_main_version }}.tar.gz *
          mv dtb-rockchip-${{ env.kernel_main_version }}.tar.gz ${{ env.armbian_path }}/

      - name: Prepare chroot directories
        run: |
          sudo mkdir -p /mnt/chroot/lib/modules
          sudo mkdir -p /mnt/chroot/usr/src
          sudo cp -a ${{ env.modules_path }}/${{ env.kernel_main_version }} /mnt/chroot/lib/modules/
          sudo cp -a ${{ env.src_path }}/linux-headers-${{ env.kernel_main_version }} /mnt/chroot/usr/src/

      - name: Install chroot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static initramfs-tools u-boot-tools

      - name: Setup chroot base system
        run: |
          sudo debootstrap --arch=arm64 --variant=minbase jammy /mnt/chroot http://ports.ubuntu.com/
          
          sudo cp /usr/bin/qemu-aarch64-static /mnt/chroot/usr/bin/
          sudo cp /etc/resolv.conf /mnt/chroot/etc/
          
          sudo mount -t proc proc /mnt/chroot/proc
          sudo mount -t sysfs sys /mnt/chroot/sys
          sudo mount -o bind /dev /mnt/chroot/dev

      - name: Pre-configure chroot environment
        run: |
          sudo chroot /mnt/chroot /bin/bash <<'PREEOF'
          echo "deb http://ports.ubuntu.com/ubuntu-ports jammy main universe multiverse" > /etc/apt/sources.list
          echo "deb http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe multiverse" >> /etc/apt/sources.list
          echo "deb http://ports.ubuntu.com/ubuntu-ports jammy-security main universe multiverse" >> /etc/apt/sources.list
          apt-get update -y
          PREEOF

      - name: Build minimal initrd in chroot (cpio format, without modules)
        run: |
          sudo chroot /mnt/chroot /bin/bash <<'EOF'
          # 安装必要包
          apt-get install -y --no-install-recommends \
            busybox-static

          # 创建临时目录
          mkdir -p /tmp/initrd
          cd /tmp/initrd
          
          # 创建最基本的目录结构
          mkdir -p bin dev etc lib proc sbin sys root
          
          # 复制 busybox（静态编译的）
          cp $(which busybox) bin/
          
          # 创建 init 脚本
          cat > init <<'INIT'
          #!/bin/busybox sh
          
          # 挂载必要的文件系统
          /bin/busybox mount -t proc proc /proc
          /bin/busybox mount -t sysfs sysfs /sys
          /bin/busybox mount -t devtmpfs devtmpfs /dev
          
          # 挂载根文件系统
          echo "Mounting root filesystem..."
          /bin/busybox mount -t ext4 /dev/mmcblk0p5 /root || \
          /bin/busybox mount -t ext4 /dev/mmcblk0p6 /root || \
          /bin/busybox mount -t ext4 /dev/mmcblk0p7 /root
          
          # 切换到真正的根文件系统
          echo "Switching to root filesystem..."
          exec /bin/busybox switch_root /root /sbin/init
          INIT
          
          # 设置权限
          chmod +x init bin/busybox
          
          # 创建必要的符号链接
          ln -sf busybox bin/sh
          ln -sf busybox bin/ls
          ln -sf busybox bin/mount
          ln -sf busybox bin/umount
          ln -sf busybox bin/cat
          ln -sf busybox bin/echo
          ln -sf busybox bin/mkdir
          ln -sf busybox bin/rm
          ln -sf busybox bin/cp
          ln -sf busybox bin/mv
          ln -sf busybox bin/chmod
          ln -sf busybox bin/chown
          ln -sf busybox bin/grep
          ln -sf busybox bin/sed
          ln -sf busybox bin/awk
          ln -sf busybox bin/kill
          ln -sf busybox bin/ps
          ln -sf busybox bin/ifconfig
          ln -sf busybox bin/route
          
          # 创建 dev 节点
          mknod -m 622 dev/console c 5 1
          mknod -m 666 dev/null c 1 3
          mknod -m 666 dev/zero c 1 5
          mknod -m 666 dev/tty c 5 0
          
          # 打包成 cpio 格式（gzip压缩）
          echo "打包成 cpio 格式..."
          find . | cpio -o -H newc | gzip -9 > /boot/initrd.img-${{ env.kernel_main_version }}
          
          # 生成 uInitrd
          echo "生成 uInitrd..."
          /usr/bin/mkimage -A arm64 -O linux -T ramdisk -C gzip -a 0 -e 0 -n uInitrd \
            -d /boot/initrd.img-${{ env.kernel_main_version }} /boot/uInitrd-${{ env.kernel_main_version }}
          
          # 清理临时目录
          cd /
          rm -rf /tmp/initrd
          
          echo "生成的 initrd 文件大小（cpio格式，不包含模块）："
          ls -lh /boot/initrd.img-${{ env.kernel_main_version }}
          ls -lh /boot/uInitrd-${{ env.kernel_main_version }}
          EOF

      - name: copy initrd.img uInitrd
        run: |
          sudo cp /mnt/chroot/boot/initrd.img-${{ env.kernel_main_version }} ${{ env.armbian_file_path }}/
          sudo cp /mnt/chroot/boot/uInitrd-${{ env.kernel_main_version }} ${{ env.armbian_file_path }}/
          echo "复制出来的initrd.img、uInitrd"
          ls -lh ${{ env.armbian_file_path }}

      - name: Clean chroot
        run: |
          sudo umount /mnt/chroot/dev 2>/dev/null || true
          sudo umount /mnt/chroot/proc 2>/dev/null || true
          sudo umount /mnt/chroot/sys 2>/dev/null || true
          sudo rm -rf /mnt/chroot

      - name: cp armbian_boot_file
        run: |
          cp -a ${{ env.src_path }}/arch/arm64/boot/Image ${{ env.armbian_file_path }}/vmlinuz-${{ env.kernel_main_version }}
          cp -a ${{ env.src_path }}/System.map ${{ env.armbian_file_path }}/System.map-${{ env.kernel_main_version }}
          cp -a ${{ env.src_path }}/.config ${{ env.armbian_file_path }}/config-${{ env.kernel_main_version }}
          cd ${{ env.armbian_file_path }}
          echo "查看未打包的boot文件"
          ls -lh
          sudo chown -R runner:runner ${{ env.armbian_file_path }}/
          tar -zcf boot-${{ env.kernel_main_version }}.tar.gz *
          echo "查看打包后所有文件"
          ls -lh

      - name: Build ap6275p_armbian-boot
        run: |
          cd ${{ env.armbian_path }}/
          mv ${{ env.src_path }}/tspi_wifi_firmware/ap6275p_wifi_firmware.tar.gz .
          mv ${{ env.armbian_file_path }}/boot-${{ env.kernel_main_version }}.tar.gz .
          echo "查看armbian_boot下所有需要打包的文件"
          ls -lh
          tar -zcf armbian_boot-${{ env.kernel_main_version }}.tar.gz *
          echo "查看打包后的文件是否存在"
          ls -lh

      - name: Upload Kernel to Release master
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.release_tag }}
          name: "RK3588 EVB4 Kernel ${{ env.kernel_main_version }}"
          artifacts: |
            ${{ env.src_path }}/boot_files/rk3588-evb4-lpddr4-v10-${{ env.kernel_main_version }}.tar.gz
            ${{ env.armbian_path }}/armbian_boot-${{ env.kernel_main_version }}.tar.gz
          body: |
            master 主线最新版本，不一定能稳定使用。设备树默认是ap6275p的WiFi模块
            tag： ${{ github.event.inputs.target_tag }}
            Kernel version: ${{ env.kernel_main_version }}
            rk3588-evb4-lpddr4-v10
            rk3588-evb4-lpddr4-v10-${{ env.kernel_main_version }}.tar.gz     里面包含boot.img、modules、headers、解压缩后，通过瑞芯微刷机工具刷入boot.img
            armbian_boot-${{ env.kernel_main_version }}.tar.gz    用于更新armbian内核的压缩包，解压缩后自行替换压缩包里面的文件到相应路径
          prerelease: false
          allowUpdates: true
          replaceArtifacts: false
